<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
  <title id="title">Aldertrace — evidence before action</title>
  <desc id="desc">Featured research project. Abstract branching paths illustrate checking evidence before selecting an action.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#202e29"/><stop offset="1" stop-color="#0c1513"/></linearGradient>
    <radialGradient id="light"><stop stop-color="#8fb89a" stop-opacity=".17"/><stop offset="1" stop-color="#8fb89a" stop-opacity="0"/></radialGradient>
    <linearGradient id="veil"><stop stop-color="#111c18"/><stop offset=".53" stop-color="#111c18" stop-opacity=".94"/><stop offset=".82" stop-color="#111c18" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8fb89a" stroke-opacity=".065"/></pattern>
    <clipPath id="clip"><rect width="960" height="340" rx="8"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="960" height="340" fill="url(#background)"/>
    <rect width="960" height="340" fill="url(#grid)"/>
    <ellipse cx="756" cy="135" rx="330" ry="270" fill="url(#light)"/>
    <g fill="none" stroke="#8fb89a">
      <circle cx="780" cy="154" r="162" stroke-opacity=".12"/>
      <circle cx="780" cy="154" r="119" stroke-opacity=".15" stroke-dasharray="3 10"/>
      <path d="M563 163H644L718 79H876M644 163L718 244H922M718 79L778 163H927M718 244L778 163" stroke-width="2" stroke-opacity=".24"/>
      <path d="M533 163H644L718 79H846" stroke="#d4b45a" stroke-width="3"/>
      <path d="M778 24V284M630 154H948" stroke-opacity=".08"/>
    </g>
    <g fill="#17251e" stroke="#638572" stroke-width="2">
      <rect x="704" y="230" width="28" height="28" rx="4"/>
      <rect x="764" y="149" width="28" height="28" rx="4"/>
      <circle cx="917" cy="163" r="7"/><circle cx="917" cy="244" r="7"/>
    </g>
    <g fill="#1b2921" stroke="#d4b45a" stroke-width="2">
      <circle cx="644" cy="163" r="10"/><rect x="704" y="65" width="28" height="28" rx="4"/>
      <circle cx="860" cy="79" r="16"/>
    </g>
    <path d="m853 79 5 5 10-11" fill="none" stroke="#d4b45a" stroke-width="2"/>
    <rect width="960" height="340" fill="url(#veil)"/>
    <rect x="32" y="32" width="4" height="18" fill="#d4b45a"/>
    <text x="48" y="47" fill="#c8d2c9" font-family="Segoe UI,Arial,sans-serif" font-size="16" letter-spacing="3">FEATURED RESEARCH</text>
    <text x="32" y="135" fill="#eee9dd" font-family="Segoe UI,Arial,sans-serif" font-size="66" font-weight="700" letter-spacing="-2">Aldertrace</text>
    <text x="36" y="180" fill="#d4b45a" font-family="Segoe UI,Arial,sans-serif" font-size="28">Evidence before action.</text>
    <text x="36" y="227" fill="#abbfb0" font-family="Consolas,monospace" font-size="16">80 synthetic cases / reproducible study</text>
    <path d="M0 276H960" stroke="#8fb89a" stroke-opacity=".2"/>
    <rect y="277" width="960" height="63" fill="#0b1411" fill-opacity=".65"/>
    <text x="36" y="314" fill="#b9c9bd" font-family="Segoe UI,Arial,sans-serif" font-size="18">PYTHON  /  AGENT RESEARCH</text>
    <text x="914" y="314" text-anchor="end" fill="#e4c776" font-family="Segoe UI,Arial,sans-serif" font-size="20">Explore the study &#8599;</text>
  </g>
  <rect x=".5" y=".5" width="959" height="339" rx="8" fill="none" stroke="#77896e" stroke-opacity=".35"/>
</svg>
